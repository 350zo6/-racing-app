<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial,sans-serif;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
#race{font-size:28px;font-weight:900;color:#ff2020}
#speed{font-size:26px;font-weight:900}
#cameraWrap{position:relative;flex:1;overflow:hidden;background:#111}
#camera{width:100%;height:100%;object-fit:cover}
#overlay{
position:absolute;left:10px;right:10px;bottom:10px;
background:rgba(0,0,0,.76);border-radius:14px;padding:12px;
display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.item{font-size:13px;color:#aaa}
.value{font-size:19px;color:#fff;font-weight:800;margin-top:2px}
#start{
height:72px;margin:12px;border:0;border-radius:16px;
background:#ff2020;color:white;font-size:25px;font-weight:900
}
</style>
</head>
<body>
<div id="app">
<header>
<div id="race">RACE</div>
<div id="speed">0 KM/H</div>
</header>
<div id="cameraWrap">
<video id="camera" autoplay playsinline muted></video>
<div id="overlay">
<div>
<div class="item">GPS</div>
<div class="value" id="gps">KEIN GPS</div>
</div>
<div>
<div class="item">G-KRAFT</div>
<div class="value" id="gforce">0.00 G</div>
</div>
<div>
<div class="item">SENSOR</div>
<div class="value" id="sensor">BEREIT</div>
</div>
<div>
<div class="item">ZEIT</div>
<div class="value" id="time">00:00</div>
</div>
</div>
</div>
<button id="start">START</button>
</div>
<script>
const camera=document.getElementById("camera");
const startButton=document.getElementById("start");
const speedDisplay=document.getElementById("speed");
const gpsDisplay=document.getElementById("gps");
const gforceDisplay=document.getElementById("gforce");
const sensorDisplay=document.getElementById("sensor");
const timeDisplay=document.getElementById("time");
let running=false;
let startTime=null;
let timer=null;
let gpsWatch=null;
let motionListenerAdded=false;
let motionEvents=0;
let gravityX=0;
let gravityY=0;
let gravityZ=0;
let gravityReady=false;
let filteredG=0;
let peakG=0;
/*
G-KRAFT BERECHNUNG
Das Telefon misst:
- Beschleunigung
- Schwerkraft
Wir schätzen die Schwerkraft mit einem
langsamen Filter und ziehen sie ab.
Dadurch bleibt die dynamische Bewegung übrig.
*/
function handleMotion(event){
motionEvents++;
if(motionEvents===1){
sensorDisplay.textContent="AKTIV";
}
const a=event.accelerationIncludingGravity;
if(!a || a.x===null || a.y===null || a.z===null){
sensorDisplay.textContent="KEINE DATEN";
return;
}
const x=Number(a.x)||0;
const y=Number(a.y)||0;
const z=Number(a.z)||0;
/*
Gravity-Filter.
Hoher alpha-Wert = langsame Anpassung.
*/
const alpha=0.92;
if(!gravityReady){
gravityX=x;
gravityY=y;
gravityZ=z;
gravityReady=true;
filteredG=0;
gforceDisplay.textContent="0.00 G";
return;
}
gravityX=alpha*gravityX+(1-alpha)*x;
gravityY=alpha*gravityY+(1-alpha)*y;
gravityZ=alpha*gravityZ+(1-alpha)*z;
const dynamicX=x-gravityX;
const dynamicY=y-gravityY;
const dynamicZ=z-gravityZ;
const acceleration=Math.sqrt(
dynamicX*dynamicX+
dynamicY*dynamicY+
dynamicZ*dynamicZ
);
const rawG=acceleration/9.80665;
/*
Glättung gegen nervöses Springen.
*/
filteredG=filteredG*0.75+rawG*0.25;
if(filteredG>peakG){
peakG=filteredG;
}
gforceDisplay.textContent=filteredG.toFixed(2)+" G";
}
async function startMotion(){
sensorDisplay.textContent="PRÜFE...";
if(!window.DeviceMotionEvent){
sensorDisplay.textContent="NICHT VERFÜGBAR";
return false;
}
try{
/*
Wichtig:
Berechtigung direkt aus dem START-Tap.
*/
if(typeof DeviceMotionEvent.requestPermission==="function"){
const permission=
await DeviceMotionEvent.requestPermission();
if(permission!=="granted"){
sensorDisplay.textContent="KEINE FREIGABE";
return false;
}
}
if(!motionListenerAdded){
window.addEventListener(
"devicemotion",
handleMotion
);
motionListenerAdded=true;
}
sensorDisplay.textContent="WARTEN";
setTimeout(()=>{
if(motionEvents===0){
sensorDisplay.textContent="KEIN SIGNAL";
}
},2500);
return true;
}catch(error){
console.log(error);
sensorDisplay.textContent="FEHLER";
return false;
}
}
async function startCamera(){
try{
const stream=
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
exact:"environment"
}
},
audio:false
});
camera.srcObject=stream;
}catch(error){
console.log(error);
}
}
function startGPS(){
if(!navigator.geolocation){
gpsDisplay.textContent="NICHT VERFÜGBAR";
return;
}
gpsWatch=
navigator.geolocation.watchPosition(
position=>{
const speed=position.coords.speed;
if(speed!==null && !isNaN(speed)){
speedDisplay.textContent=
(speed*3.6).toFixed(0)+" KM/H";
}
gpsDisplay.textContent="AKTIV";
},
()=>{
gpsDisplay.textContent="KEIN GPS";
},
{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
}
);
}
function startTimer(){
startTime=Date.now();
timer=setInterval(()=>{
const elapsed=
Math.floor(
(Date.now()-startTime)/1000
);
const minutes=
Math.floor(elapsed/60);
const seconds=
elapsed%60;
timeDisplay.textContent=
String(minutes).padStart(2,"0")
+":"
+String(seconds).padStart(2,"0");
},250);
}
function stopRace(){
running=false;
startButton.textContent="START";
if(timer){
clearInterval(timer);
timer=null;
}
if(gpsWatch!==null){
navigator.geolocation.clearWatch(gpsWatch);
gpsWatch=null;
}
const stream=camera.srcObject;
if(stream){
stream
.getTracks()
.forEach(track=>track.stop());
camera.srcObject=null;
}
}
startButton.addEventListener(
"click",
async()=>{
if(running){
stopRace();
return;
}
running=true;
startButton.textContent="STOP";
/*
Neue Runde:
Sensorwerte zurücksetzen.
*/
motionEvents=0;
gravityReady=false;
gravityX=0;
gravityY=0;
gravityZ=0;
filteredG=0;
peakG=0;
gforceDisplay.textContent="0.00 G";
/*
1. Bewegungssensor
2. Kamera
3. GPS
4. Timer
*/
await startMotion();
await startCamera();
startGPS();
startTimer();
}
);
</script>
</body>
</html>
