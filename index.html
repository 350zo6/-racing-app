<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACE Sensor Diagnose</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column}
header{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
#race{font-size:28px;font-weight:900;color:#ff2020}
#speed{font-size:26px;font-weight:900}
#cameraWrap{position:relative;height:calc(100vh - 132px);overflow:hidden;background:#111}
#camera{width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.78);padding:12px;border-rad
.item{font-size:14px;color:#aaa;margin-top:5px}
.value{font-size:19px;font-weight:800;word-break:break-word}
#start{height:72px;margin:12px;border:0;border-radius:16px;background:#ff2020;color:#fff;font-size:25px;font-w
</style>
</head>
<body>
<div id="app">
<header>
<div id="race">RACE</div>
<div id="speed">0 KM/H</div>
</header>
<div id="cameraWrap">
<video id="camera" autoplay playsinline muted></video>
<div id="overlay">
<div class="item">GPS</div>
<div class="value" id="gps">KEIN GPS</div>
<div class="item">G-KRAFT</div>
<div class="value" id="gforce">—</div>
<div class="item">SENSOR</div>
<div class="value" id="sensor">WARTEN</div>
<div class="item">FEHLERDETAIL</div>
<div class="value" id="errorDetail">—</div>
<div class="item">ZEIT</div>
<div class="value" id="time">00:00</div>
</div>
</div>
<button id="start">START</button>
</div>
<script>
const camera=document.getElementById("camera");
const startButton=document.getElementById("start");
const speedDisplay=document.getElementById("speed");
const gpsDisplay=document.getElementById("gps");
const gforceDisplay=document.getElementById("gforce");
const sensorDisplay=document.getElementById("sensor");
const errorDetail=document.getElementById("errorDetail");
const timeDisplay=document.getElementById("time");
let running=false;
let startTime=null;
let timer=null;
let gpsWatch=null;
let motionListenerAdded=false;
let motionEvents=0;
async function startMotion(){
sensorDisplay.textContent="PRÜFE...";
errorDetail.textContent="";
if(!window.DeviceMotionEvent){
sensorDisplay.textContent="NICHT VERFÜGBAR";
errorDetail.textContent="DeviceMotionEvent fehlt";
return;
}
try{
if(typeof DeviceMotionEvent.requestPermission==="function"){
errorDetail.textContent="requestPermission gefunden";
const permission=await DeviceMotionEvent.requestPermission();
if(permission!=="granted"){
sensorDisplay.textContent="KEINE FREIGABE";
errorDetail.textContent="Antwort: "+permission;
return;
}
}else{
errorDetail.textContent="Keine requestPermission-Funktion";
}
if(!motionListenerAdded){
window.addEventListener("devicemotion",handleMotion);
motionListenerAdded=true;
}
sensorDisplay.textContent="WARTEN";
errorDetail.textContent="Berechtigung OK – warte auf Signal";
setTimeout(()=>{
if(motionEvents===0){
sensorDisplay.textContent="KEIN SIGNAL";
errorDetail.textContent="Keine devicemotion Events";
}
},2500);
}catch(error){
sensorDisplay.textContent="FEHLER";
errorDetail.textContent=
(error.name||"Unbekannter Fehler")+" – "+(error.message||String(error));
console.log(error);
}
}
function handleMotion(event){
motionEvents++;
sensorDisplay.textContent="AKTIV";
errorDetail.textContent="Event #"+motionEvents;
const a=event.accelerationIncludingGravity;
if(!a || a.x===null || a.y===null || a.z===null){
gforceDisplay.textContent="KEINE DATEN";
errorDetail.textContent="Sensor Event da, aber Werte fehlen";
return;
}
const x=a.x||0,y=a.y||0,z=a.z||0;
const total=Math.sqrt(x*x+y*y+z*z);
const g=Math.abs(total/9.80665-1);
gforceDisplay.textContent=g.toFixed(2)+" G";
}
async function startCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{exact:"environment"}},
audio:false
});
camera.srcObject=stream;
}catch(error){
console.log(error);
}
}
function startGPS(){
if(!navigator.geolocation)return;
gpsWatch=navigator.geolocation.watchPosition(
position=>{
if(position.coords.speed!==null){
speedDisplay.textContent=(position.coords.speed*3.6).toFixed(0)+" KM/H";
}
gpsDisplay.textContent="AKTIV";
},
()=>{gpsDisplay.textContent="KEIN GPS";},
{enableHighAccuracy:true,maximumAge:1000,timeout:10000}
);
}
function startTimer(){
startTime=Date.now();
timer=setInterval(()=>{
const e=Math.floor((Date.now()-startTime)/1000);
timeDisplay.textContent=
String(Math.floor(e/60)).padStart(2,"0")+":"+
String(e%60).padStart(2,"0");
},250);
}
function stopRace(){
running=false;
startButton.textContent="START";
if(timer)clearInterval(timer);
if(gpsWatch!==null){
navigator.geolocation.clearWatch(gpsWatch);
gpsWatch=null;
}
const stream=camera.srcObject;
if(stream)stream.getTracks().forEach(track=>track.stop());
camera.srcObject=null;
}
startButton.addEventListener("click",async()=>{
if(running){
stopRace();
return;
}
running=true;
startButton.textContent="STOP";
motionEvents=0;
/* Motion direkt aus dem START-Tap */
await startMotion();
await startCamera();
startGPS();
startTimer();
});
</script>
</body>
</html>
