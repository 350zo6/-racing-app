<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>DM Motion</title>
<style>
:root{
--red:#ff2028;
--panel:rgba(15,15,17,.78);
--line:rgba(255,255,255,.14);
--safe-top:env(safe-area-inset-top);
--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
body{touch-action:manipulation}
#app{position:fixed;inset:0;background:#050505;overflow:hidden}
#camera{
position:absolute;left:0;top:0;width:100%;height:100%;
object-fit:cover;background:#111;z-index:1;
}
#shade{
position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;
pointer-events:none;
background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.03) 36%,rgba(0,0,0,.10) 58%,rgba(0,0,0,.88) 100%);
}
#placeholder{
position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;
display:flex;align-items:center;justify-content:center;
color:#3b3b3b;font-size:12px;letter-spacing:2px;pointer-events:none;
}
#header{
position:absolute;left:0;right:0;top:calc(8px + var(--safe-top));
height:78px;z-index:20;
display:flex;justify-content:space-between;align-items:flex-start;
padding:0 18px;pointer-events:none;
}
#logo{
#logoBox{pointer-events:none;text-shadow:0 3px 15px #000}
font-size:25px;line-height:1;font-weight:950;letter-spacing:-1.5px;
}
#logo .red{color:var(--red)}
#tagline{
margin-top:6px;font-size:9px;letter-spacing:2.8px;font-weight:700;color:#d0d0d0;
}
#speed{
#speedBox{text-align:right;text-shadow:0 3px 15px #000}
font-size:50px;line-height:.88;font-weight:850;letter-spacing:-2px;
}
#speedUnit{
margin-top:6px;font-size:10px;line-height:1;letter-spacing:2px;font-weight:850;color:#ddd;
}
#rec{
position:absolute;left:18px;top:calc(82px + var(--safe-top));z-index:20;
display:none;align-items:center;gap:7px;
padding:7px 10px;border-radius:999px;
background:rgba(0,0,0,.50);border:1px solid rgba(255,255,255,.16);
font-size:9px;font-weight:900;letter-spacing:1.6px;
}
#recDot{
width:7px;height:7px;border-radius:50%;background:var(--red);
box-shadow:0 0 10px var(--red);
}
#menuBtn{
position:absolute;right:18px;top:calc(78px + var(--safe-top));z-index:21;
width:42px;height:42px;border-radius:13px;
border:1px solid rgba(255,255,255,.18);
background:rgba(0,0,0,.45);color:#fff;font-size:20px;
}
#hud{
position:absolute;left:16px;right:16px;bottom:calc(92px + var(--safe-bottom));
z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.card{
min-width:0;padding:11px 10px;border:1px solid var(--line);border-radius:14px;
background:var(--panel);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
}
.label{font-size:8px;letter-spacing:2px;color:#888;font-weight:850}
.value{
margin-top:4px;font-size:17px;font-weight:800;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#status{
position:absolute;left:50%;bottom:calc(77px + var(--safe-bottom));
transform:translateX(-50%);z-index:20;
color:#aaa;font-size:9px;letter-spacing:1.6px;white-space:nowrap;
text-shadow:0 2px 8px #000;
}
#controls{
position:absolute;left:0;right:0;bottom:calc(9px + var(--safe-bottom));
z-index:20;display:flex;justify-content:center;
}
#start{
width:calc(100% - 32px);max-width:520px;height:58px;
border:0;border-radius:18px;
background:linear-gradient(180deg,#ff3038,#e20d15);
color:#fff;font-size:15px;font-weight:950;letter-spacing:2px;
box-shadow:0 12px 35px rgba(255,25,35,.28);
}
#start.stop{
background:rgba(10,10,10,.84);
border:1px solid rgba(255,255,255,.24);box-shadow:none;
}
#menu{
position:absolute;inset:0;z-index:100;display:none;
background:rgba(0,0,0,.72);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
#menu.open{display:block}
.panel{
position:absolute;left:0;top:0;bottom:0;width:min(360px,88vw);
background:rgba(10,10,11,.97);
border-right:1px solid rgba(255,255,255,.10);
padding:calc(22px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
}
.menuHead{
display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;
}
.menuTitle{font-size:27px;font-weight:900;letter-spacing:-1px}
.menuSub{font-size:9px;letter-spacing:2px;color:#777;margin-top:4px}
.close{border:0;background:none;color:#fff;font-size:30px}
.item{
display:flex;justify-content:space-between;width:100%;
padding:17px 2px;background:none;border:0;
border-bottom:1px solid rgba(255,255,255,.08);
color:#fff;font-size:15px;text-align:left;
}
.item span{color:#666;font-size:20px}
@media (max-width:600px) and (orientation:portrait){
#hud{grid-template-columns:repeat(2,1fr)}
#speed{font-size:45px}
}
@media (orientation:landscape){
#header{
padding:0 24px;height:82px;
}
#logo{font-size:23px}
#tagline{font-size:8px}
/* Speed gets its own space; menu sits separately at the far right. */
#speedBox{
position:absolute;
right:82px;
top:0;
}
#speed{font-size:44px}
#speedUnit{font-size:9px}
#rec{left:24px;top:calc(68px + var(--safe-top))}
#menuBtn{
right:22px;
top:calc(16px + var(--safe-top));
width:42px;height:42px;
}
/* Telemetry becomes a clean right-side rail instead of floating in the middle. */
#hud{
left:auto;
right:22px;
top:auto;
bottom:calc(18px + var(--safe-bottom));
width:min(300px,31vw);
grid-template-columns:1fr 1fr;
gap:7px;
}
.card{
min-height:62px;
padding:7px 9px;
border-radius:11px;
}
.label{
font-size:7px;
letter-spacing:1.7px;
}
.value{
margin-top:3px;
font-size:13px;
letter-spacing:-.2px;
}
#controls{
left:22px;right:auto;
bottom:calc(18px + var(--safe-bottom));
justify-content:flex-start;
}
#start{width:min(330px,38vw);height:54px}
#status{
left:22px;transform:none;
bottom:calc(79px + var(--safe-bottom));
}
}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<div id="shade"></div>
<div id="placeholder">CAMERA READY</div>
<div id="header">
<div id="logoBox">
<div id="logo">DM<span class="red">//</span>MOTION</div>
<div id="tagline">DRIVE TELEMETRY</div>
</div>
<div id="speedBox">
<div id="speed">0</div>
<div id="speedUnit">KM/H</div>
</div>
</div>
<div id="rec"><span id="recDot"></span>REC</div>
<button id="menuBtn" aria-label="Menü">■</button>
<div id="hud">
<div class="card"><div class="label">GPS</div><div class="value" id="gps">BEREIT</div></div>
<div class="card"><div class="label">G-KRAFT</div><div class="value" id="gforce">0.00 G</div></div>
<div class="card"><div class="label">SENSOR</div><div class="value" id="sensor">BEREIT</div></div>
<div class="card"><div class="label">ZEIT</div><div class="value" id="time">00:00</div></div>
</div>
<div id="status">DM MOTION • READY</div>
<div id="controls"><button id="start">START DRIVE</button></div>
<div id="menu">
<div class="panel">
<div class="menuHead">
<div>
<div class="menuTitle">DM Motion</div>
<div class="menuSub">DRIVE TELEMETRY</div>
</div>
<button class="close" id="closeMenu">×</button>
</div>
<button class="item">Drive <span>›</span></button>
<button class="item">My Drives <span>›</span></button>
<button class="item">Analysis <span>›</span></button>
<button class="item">Tracks <span>›</span></button>
<button class="item">Settings <span>›</span></button>
</div>
</div>
</div>
<script>
const camera=document.getElementById("camera");
const placeholder=document.getElementById("placeholder");
const startButton=document.getElementById("start");
const speedDisplay=document.getElementById("speed");
const gpsDisplay=document.getElementById("gps");
const gforceDisplay=document.getElementById("gforce");
const sensorDisplay=document.getElementById("sensor");
const timeDisplay=document.getElementById("time");
const recordBadge=document.getElementById("rec");
const statusDisplay=document.getElementById("status");
let running=false;
let startTime=null;
let timer=null;
let gpsWatch=null;
let motionListenerAdded=false;
let motionEvents=0;
let gravityX=0,gravityY=0,gravityZ=0;
let gravityReady=false;
let filteredG=0;
function setStatus(t){statusDisplay.textContent=t}
function resetValues(){
speedDisplay.textContent="0";
gpsDisplay.textContent="BEREIT";
gforceDisplay.textContent="0.00 G";
sensorDisplay.textContent="BEREIT";
timeDisplay.textContent="00:00";
gravityX=0;gravityY=0;gravityZ=0;
gravityReady=false;filteredG=0;motionEvents=0;
}
function handleMotion(event){
motionEvents++;
if(motionEvents===1)sensorDisplay.textContent="AKTIV";
const a=event.accelerationIncludingGravity;
if(!a || a.x===null || a.y===null || a.z===null){
sensorDisplay.textContent="KEINE DATEN";
return;
}
const x=Number(a.x)||0;
const y=Number(a.y)||0;
const z=Number(a.z)||0;
const alpha=.92;
if(!gravityReady){
gravityX=x;gravityY=y;gravityZ=z;
gravityReady=true;
filteredG=0;
gforceDisplay.textContent="0.00 G";
return;
}
gravityX=alpha*gravityX+(1-alpha)*x;
gravityY=alpha*gravityY+(1-alpha)*y;
gravityZ=alpha*gravityZ+(1-alpha)*z;
const dx=x-gravityX;
const dy=y-gravityY;
const dz=z-gravityZ;
const acceleration=Math.sqrt(dx*dx+dy*dy+dz*dz);
const rawG=acceleration/9.80665;
filteredG=filteredG*.75+rawG*.25;
gforceDisplay.textContent=filteredG.toFixed(2)+" G";
}
async function startMotion(){
sensorDisplay.textContent="PRÜFE...";
if(!window.DeviceMotionEvent){
sensorDisplay.textContent="NICHT VERFÜGBAR";
return false;
}
try{
if(typeof DeviceMotionEvent.requestPermission==="function"){
const permission=await DeviceMotionEvent.requestPermission();
if(permission!=="granted"){
sensorDisplay.textContent="KEINE FREIGABE";
return false;
}
}
if(!motionListenerAdded){
window.addEventListener("devicemotion",handleMotion);
motionListenerAdded=true;
}
sensorDisplay.textContent="WARTEN";
motionEvents=0;
setTimeout(()=>{
},2500);
return true;
}catch(error){
console.log(error);
sensorDisplay.textContent="FEHLER";
return false;
if(running && motionEvents===0)sensorDisplay.textContent="KEIN SIGNAL";
}
}
async function startCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{exact:"environment"}},
audio:false
});
camera.srcObject=stream;
camera.muted=true;
camera.playsInline=true;
placeholder.style.display="none";
await camera.play().catch(()=>{});
return true;
}catch(error){
console.log("Camera:",error);
setStatus("KAMERA NICHT FREIGEGEBEN");
return false;
}
}
function startGPS(){
if(!navigator.geolocation){
gpsDisplay.textContent="NICHT VERFÜGBAR";
return;
}
gpsWatch=navigator.geolocation.watchPosition(
position=>{
const speed=position.coords.speed;
if(speed!==null && !isNaN(speed)){
speedDisplay.textContent=(speed*3.6).toFixed(0);
}
gpsDisplay.textContent="AKTIV";
},
()=>{gpsDisplay.textContent="KEIN GPS"},
{enableHighAccuracy:true,maximumAge:1000,timeout:10000}
);
}
function startTimer(){
startTime=Date.now();
timer=setInterval(()=>{
const elapsed=Math.floor((Date.now()-startTime)/1000);
const minutes=Math.floor(elapsed/60);
const seconds=elapsed%60;
timeDisplay.textContent=String(minutes).padStart(2,"0")+":"+String(seconds).padStart(2,"0");
},250);
}
function stopRace(){
running=false;
startButton.textContent="START DRIVE";
startButton.classList.remove("stop");
recordBadge.style.display="none";
if(timer){clearInterval(timer);timer=null}
if(gpsWatch!==null){
navigator.geolocation.clearWatch(gpsWatch);
gpsWatch=null;
}
const stream=camera.srcObject;
if(stream)stream.getTracks().forEach(track=>track.stop());
camera.srcObject=null;
placeholder.style.display="flex";
resetValues();
setStatus("DM MOTION • READY");
}
startButton.addEventListener("click",async()=>{
if(running){
stopRace();
return;
}
running=true;
startButton.textContent="STOP DRIVE";
startButton.classList.add("stop");
recordBadge.style.display="flex";
resetValues();
setStatus("STARTING...");
await startMotion();
await startCamera();
startGPS();
startTimer();
if(camera.srcObject)setStatus("DM MOTION • RECORDING");
});
document.getElementById("menuBtn").onclick=()=>{
document.getElementById("menu").classList.add("open");
};
document.getElementById("closeMenu").onclick=()=>{
document.getElementById("menu").classList.remove("open");
};
document.getElementById("menu").addEventListener("click",e=>{
if(e.target===document.getElementById("menu")){
document.getElementById("menu").classList.remove("open");
}
});
resetValues();
</script>
</body>
</html>
