<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>DM Motion</title>
<style>
:root{
--red:#ff2028; --bg:#050505; --panel:rgba(18,18,20,.78);
--line:rgba(255,255,255,.12); --safe-top:env(safe-area-inset-top);
--safe-bottom:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{touch-action:manipulation}
#app{position:fixed;inset:0;background:#050505}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;z-index:0}
#shade{position:absolute;inset:0;z-index:1;pointer-events:none;
background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.03) 34%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.88) 100%)}
#placeholder{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
color:#333;font-size:12px;letter-spacing:2px;pointer-events:none}
#top{position:absolute;top:calc(12px + var(--safe-top));left:0;right:0;z-index:5;
display:flex;justify-content:space-between;align-items:flex-start;padding:0 18px}
.brand{font-weight:900;letter-spacing:-1.4px;font-size:25px;text-shadow:0 2px 14px #000}
.brand .slash{color:var(--red)}
.sub{font-size:9px;letter-spacing:2.8px;color:#bbb;margin-top:4px;font-weight:700}
.speed{text-align:right;text-shadow:0 3px 14px #000}
.speedNum{font-size:47px;font-weight:850;line-height:.9;letter-spacing:-2px}
.speedUnit{font-size:10px;letter-spacing:2px;font-weight:800;color:#ddd;margin-top:5px}
#rec{display:none;position:absolute;left:18px;top:calc(70px + var(--safe-top));z-index:6;
align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.5);
border:1px solid rgba(255,255,255,.15);font-size:9px;font-weight:900;letter-spacing:1.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
#menuBtn{position:absolute;right:16px;top:calc(72px + var(--safe-top));z-index:8;
width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.18);
background:rgba(0,0,0,.45);color:#fff;font-size:21px}
#hud{position:absolute;left:16px;right:16px;bottom:calc(91px + var(--safe-bottom));z-index:5;
display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{min-width:0;padding:11px 10px;border:1px solid var(--line);border-radius:14px;
background:var(--panel);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.label{font-size:8px;letter-spacing:2px;color:#888;font-weight:850}
.value{font-size:17px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-bottom));
z-index:7;color:#aaa;font-size:9px;letter-spacing:1.6px;white-space:nowrap;text-shadow:0 2px 8px #000}
#controls{position:absolute;left:0;right:0;bottom:calc(9px + var(--safe-bottom));z-index:7;
display:flex;justify-content:center}
#start{width:calc(100% - 32px);max-width:520px;height:58px;border:0;border-radius:18px;
background:linear-gradient(180deg,#ff3038,#e20d15);color:#fff;font-size:15px;font-weight:950;
letter-spacing:2px;box-shadow:0 12px 35px rgba(255,25,35,.28)}
#start.stop{background:rgba(10,10,10,.84);border:1px solid rgba(255,255,255,.24);box-shadow:none}
#menu{position:absolute;inset:0;z-index:20;display:none;background:rgba(0,0,0,.72);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#menu.open{display:block}
.panel{position:absolute;left:0;top:0;bottom:0;width:min(360px,88vw);background:rgba(10,10,11,.97);
border-right:1px solid rgba(255,255,255,.1);padding:calc(22px + var(--safe-top)) 20px calc(20px + var(--safe-bottom))}
.menuHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.menuTitle{font-size:27px;font-weight:900;letter-spacing:-1px}
.menuSub{font-size:9px;letter-spacing:2px;color:#777;margin-top:4px}
.close{border:0;background:none;color:#fff;font-size:30px}
.item{display:flex;justify-content:space-between;width:100%;padding:17px 2px;background:none;
border:0;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;font-size:15px;text-align:left}
.item span{color:#666;font-size:20px}
@media (max-width:600px) and (orientation:portrait){
#hud{grid-template-columns:repeat(2,1fr)}
.speedNum{font-size:44px}
}
@media (orientation:landscape){
#top{padding:0 22px}.speedNum{font-size:42px}
#menuBtn{top:calc(14px + var(--safe-top));right:22px}
#rec{left:22px;top:calc(62px + var(--safe-top))}
#hud{left:auto;right:18px;bottom:calc(82px + var(--safe-bottom));width:245px;grid-template-columns:1fr 1fr}
#controls{left:20px;right:auto;bottom:calc(18px + var(--safe-bottom));justify-content:flex-start}
#start{width:235px;height:52px}
#status{left:20px;transform:none;bottom:calc(77px + var(--safe-bottom))}
}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<div id="placeholder">CAMERA READY</div>
<div id="shade"></div>
<div id="top">
<div>
</div>
</div>
<div class="brand">DM<span class="slash">//</span>MOTION</div>
<div class="sub">DRIVE TELEMETRY</div>
<div class="speed"><div class="speedNum" id="speed">0</div><div class="speedUnit">KM/H</div></div>
<button id="menuBtn" aria-label="Menü">■</button>
<div id="rec"><i class="dot"></i>REC</div>
<div id="hud">
<div class="card"><div class="label">GPS</div><div class="value" id="gps">BEREIT</div></div>
<div class="card"><div class="label">G-KRAFT</div><div class="value" id="gforce">0.00 G</div></div>
<div class="card"><div class="label">SENSOR</div><div class="value" id="sensor">BEREIT</div></div>
<div class="card"><div class="label">ZEIT</div><div class="value" id="time">00:00</div></div>
</div>
<div id="status">DM MOTION • READY</div>
<div id="controls"><button id="start">START DRIVE</button></div>
<div id="menu">
<div class="panel">
<div class="menuHead">
<div><div class="menuTitle">DM Motion</div><div class="menuSub">DRIVE TELEMETRY</div></div>
<button class="close" id="closeMenu">×</button>
</div>
<button class="item">Drive <span>›</span></button>
<button class="item">My Drives <span>›</span></button>
<button class="item">Analysis <span>›</span></button>
<button class="item">Tracks <span>›</span></button>
<button class="item">Settings <span>›</span></button>
</div>
</div>
</div>
<script>
const camera=document.getElementById("camera"),placeholder=document.getElementById("placeholder");
const startButton=document.getElementById("start"),speedDisplay=document.getElementById("speed");
const gpsDisplay=document.getElementById("gps"),gforceDisplay=document.getElementById("gforce");
const sensorDisplay=document.getElementById("sensor"),timeDisplay=document.getElementById("time");
const recordBadge=document.getElementById("rec"),statusDisplay=document.getElementById("status");
let running=false,startTime=null,timer=null,gpsWatch=null,motionListenerAdded=false;
let motionEvents=0,gravityX=0,gravityY=0,gravityZ=0,gravityReady=false,filteredG=0;
function setStatus(t){statusDisplay.textContent=t}
function resetValues(){
speedDisplay.textContent="0";gpsDisplay.textContent="BEREIT";gforceDisplay.textContent="0.00 G";
sensorDisplay.textContent="BEREIT";timeDisplay.textContent="00:00";
gravityX=0;gravityY=0;gravityZ=0;gravityReady=false;filteredG=0;motionEvents=0;
}
function handleMotion(event){
motionEvents++;
if(motionEvents===1)sensorDisplay.textContent="AKTIV";
const a=event.accelerationIncludingGravity;
if(!a||a.x===null||a.y===null||a.z===null){sensorDisplay.textContent="KEINE DATEN";return}
const x=Number(a.x)||0,y=Number(a.y)||0,z=Number(a.z)||0,alpha=.92;
if(!gravityReady){
gravityX=x;gravityY=y;gravityZ=z;gravityReady=true;filteredG=0;gforceDisplay.textContent="0.00 G";return;
}
gravityX=alpha*gravityX+(1-alpha)*x;
gravityY=alpha*gravityY+(1-alpha)*y;
gravityZ=alpha*gravityZ+(1-alpha)*z;
const dx=x-gravityX,dy=y-gravityY,dz=z-gravityZ;
const acceleration=Math.sqrt(dx*dx+dy*dy+dz*dz);
const rawG=acceleration/9.80665;
filteredG=filteredG*.75+rawG*.25;
gforceDisplay.textContent=filteredG.toFixed(2)+" G";
}
async function startMotion(){
sensorDisplay.textContent="PRÜFE...";
if(!window.DeviceMotionEvent){sensorDisplay.textContent="NICHT VERFÜGBAR";return false}
try{
if(typeof DeviceMotionEvent.requestPermission==="function"){
const permission=await DeviceMotionEvent.requestPermission();
if(permission!=="granted"){sensorDisplay.textContent="KEINE FREIGABE";return false}
}
if(!motionListenerAdded){
window.addEventListener("devicemotion",handleMotion);
motionListenerAdded=true;
}
sensorDisplay.textContent="WARTEN";motionEvents=0;
setTimeout(()=>{if(running&&motionEvents===0)sensorDisplay.textContent="KEIN SIGNAL"},2500);
return true;
}catch(error){console.log(error);sensorDisplay.textContent="FEHLER";return false}
}
async function startCamera(){
try{
const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{exact:"environment"}},audio:false
});
camera.srcObject=stream;
camera.muted=true;
camera.playsInline=true;
placeholder.style.display="none";
await camera.play().catch(()=>{});
return true;
}catch(error){
console.log("Camera:",error);
setStatus("KAMERA NICHT FREIGEGEBEN");
return false;
}
}
function startGPS(){
if(!navigator.geolocation){gpsDisplay.textContent="NICHT VERFÜGBAR";return}
gpsWatch=navigator.geolocation.watchPosition(position=>{
const speed=position.coords.speed;
if(speed!==null&&!isNaN(speed))speedDisplay.textContent=(speed*3.6).toFixed(0);
gpsDisplay.textContent="AKTIV";
},()=>{gpsDisplay.textContent="KEIN GPS"},
{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function startTimer(){
startTime=Date.now();
timer=setInterval(()=>{
const elapsed=Math.floor((Date.now()-startTime)/1000);
const minutes=Math.floor(elapsed/60),seconds=elapsed%60;
timeDisplay.textContent=String(minutes).padStart(2,"0")+":"+String(seconds).padStart(2,"0");
},250);
}
function stopRace(){
running=false;
startButton.textContent="START DRIVE";startButton.classList.remove("stop");
recordBadge.style.display="none";
if(timer){clearInterval(timer);timer=null}
if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}
const stream=camera.srcObject;
if(stream)stream.getTracks().forEach(track=>track.stop());
camera.srcObject=null;placeholder.style.display="flex";
resetValues();setStatus("DM MOTION • READY");
}
startButton.addEventListener("click",async()=>{
if(running){stopRace();return}
running=true;
startButton.textContent="STOP DRIVE";startButton.classList.add("stop");
recordBadge.style.display="flex";resetValues();
setStatus("STARTING...");
await startMotion();
await startCamera();
startGPS();
startTimer();
if(camera.srcObject)setStatus("DM MOTION • RECORDING");
});
document.getElementById("menuBtn").onclick=()=>document.getElementById("menu").classList.add("open");
document.getElementById("closeMenu").onclick=()=>document.getElementById("menu").classList.remove("open");
document.getElementById("menu").addEventListener("click",e=>{
if(e.target===document.getElementById("menu"))document.getElementById("menu").classList.remove("open");
});
resetValues();
</script>
</body>
</html>
